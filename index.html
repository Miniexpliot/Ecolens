<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoLens - Understand, track, and reduce your carbon footprint with personalized AI-powered insights. Calculate your CO2 emissions and get actionable recommendations.">
  <meta name="theme-color" content="#060b18">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <title>EcoLens — Personal Carbon Footprint Tracker</title>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Three.js for 3D Interactive Globe (Deferred for Efficiency) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>

  <!-- Critical inline styles to prevent flash of unstyled content -->
  <style>
    html, body {
      background-color: transparent; /* Changed from #060b18 so canvas shows */
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app-root {
      flex: 1;
    }
    .main-footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body>
  <!-- Skip Navigation Link -->
  <a href="#main-content" class="skip-nav">Skip to main content</a>

  <!-- 3D Interactive Background Canvas -->
  <canvas id="bg-canvas" aria-hidden="true" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>

  <!-- App Root: All content rendered by JS -->
  <div id="app-root"></div>

  <!-- Professional Footer -->
  <footer class="main-footer">
    <div class="container">
      &copy; <span id="year"></span> EcoLens Inc. All rights reserved.<br>
      Powered by local AI.
    </div>
  </footer>

  <!-- Module Entry Point -->
  <script type="module" src="js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
